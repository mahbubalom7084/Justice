<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Justice</title>
    <script src="https://cdn.jsdelivr.net/npm/@tailwindcss/browser@4"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/7.0.1/css/all.min.css"
        integrity="sha512-2SwdPD6INVrV/lHTZbO2nodKhrnDdJK9/kg2XD1r9uGqPo1cUbujc+IYdlYdEErWNu69gVcYgdxlmVmzTWnetw=="
        crossorigin="anonymous" referrerpolicy="no-referrer" />
    <!-- google-fonts -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link
        href="https://fonts.googleapis.com/css2?family=EB+Garamond:ital,wght@0,400..800;1,400..800&family=Poppins:ital,wght@0,100;0,200;0,300;0,400;0,500;0,600;0,700;0,800;0,900;1,100;1,200;1,300;1,400;1,500;1,600;1,700;1,800;1,900&display=swap"
        rel="stylesheet">
</head>

<body>
    <header>
        <nav class="flex justify-between items-center w-[80%] mx-auto py-8">
            <div class="flex items-center">
                <img class="mr-3" src="./images/logo.png" alt="">
                <h1 class="font-extrabold font-[EB Garamond] text-[35px] text-[#414040]">Justice</h1>
            </div>
            <div>
                <a class="mr-5 font-normal font-[Poppins] text-base text-[#707070]" href="">Home</a>
                <a class="mr-5 font-normal font-[Poppins] text-base text-[#707070]" href="">Services <i
                        class="fa-solid fa-angle-right"></i></a>
                <a class="mr-5 font-normal font-[Poppins] text-base text-[#707070]" href="">Cases <i
                        class="fa-solid fa-angle-right"></i></a>
                <a class="mr-5 font-normal font-[Poppins] text-base text-[#707070]" href="">Blog <i
                        class="fa-solid fa-angle-right"></i></a>
                <a class="font-normal font-[Poppins] text-base text-[#707070]" href="">Contact Us <i
                        class="fa-solid fa-angle-right"></i></a>
            </div>
            <div>
                <button
                    class="font-semibold font-[Poppins] text-lg text-[#FFFFFF] py-4 px-6 rounded-lg bg-[#B68C5A]">Free
                    Consultation</button>
            </div>
        </nav>
    </header>
    <main>
        <!-- banner-section-start -->
        <section>
            <div class="mb-[100px] w-[80%] mx-auto h-[550px]  bg-[url(./images/banner.jpg)] rounded-[8px] bg-cover bg-center">
                <div class="text-center py-16">
                    <h1 class="mt-16 font-extrabold font-[EB Garamond] text-7xl  text-[#FFFFFF] leading-[75px]">We
                        Provide Effective<br />
                        Legal Solutions</h1>
                    <p class="mt-5 font-normal font-[Poppins] text-base  text-[#E7E7E7] leading-[26px]">There are many
                        variations of passages of Lorem Ipsum available, but the majority<br /> have suffered
                        alteration in some form, by injected humour.</p>
                    <div class="mt-8 ">
                        <input class="w-[500px] bg-white text-[#A0A0A0] mr-5 p-4 font-normal font-[Poppins] text-base rounded-lg" type="search"
                            name="" id="" placeholder="Search your services">
                        <button
                            class="font-semibold font-[Poppins] text-lg text-[#FFFFFF] py-4 px-7 rounded-lg bg-[#B68C5A]">Search</button>
                    </div>
                </div>
            </div>
        </section>
        <!-- banner-section-start -->
    </main>
</body>

</html>
